<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindrops | Software & Digital Prototype Development</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons for Contact & Social Links -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Spline Viewer Web Component Script -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>
</head>
<body>

    <!-- 1. TOP CONTACT BAR -->
    <div class="top-bar">
        <div class="top-contact-info">
            <a href="tel:#" class="top-contact-item">
                <i class="fa-solid fa-phone"></i>
                <span>Sales Enquiry</span>
            </a>
            <span class="top-divider">|</span>
            <a href="tel:#" class="top-contact-item">
                <i class="fa-solid fa-phone"></i>
                <span>HR Enquiry</span>
            </a>
            <span class="top-divider">|</span>
            <a href="mailto:info@mindrops.com" class="top-contact-item">
                <i class="fa-solid fa-envelope"></i>
                <span>info@mindrops.com</span>
            </a>
        </div>
        <div class="top-social-links">
            <a href="#" aria-label="LinkedIn" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#" aria-label="Facebook" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="X" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" aria-label="Instagram" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </div>

    <!-- 2. NAVIGATION BAR -->
    <nav class="navbar">
        <a href="#" class="logo-container" aria-label="Mindrops Home">
            <img src="logo.png" alt="Mindrops Logo" class="logo-img">
        </a>

        <ul class="nav-menu">
            <li class="nav-item"><a href="#">HOME</a></li>
            <li class="nav-item"><a href="#">ABOUT US <i class="fa-solid fa-chevron-down"></i></a></li>
            <li class="nav-item"><a href="#">SERVICES <i class="fa-solid fa-chevron-down"></i></a></li>
            <li class="nav-item"><a href="#">CLIENTS</a></li>
            <li class="nav-item"><a href="#">CAREERS</a></li>
            <li class="nav-item"><a href="#">CONTACT US</a></li>
        </ul>

        <div class="nav-actions">
            <a href="#" class="btn-quote">GET A QUOTE</a>
            <div class="lang-selector">EN</div>
            <div class="mobile-toggle"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <!-- 3. FULL WIDTH HERO SECTION -->
    <section class="hero-section">
        
        <!-- Parent 3D Container (.hero-3d with overflow: hidden) -->
        <div class="hero-3d">
            <spline-viewer url="https://prod.spline.design/OW7mUasDYz7kem2f/scene.splinecode"></spline-viewer>
        </div>

        <!-- Text Content Overlay Layer -->
        <div class="hero-overlay-wrapper">
            <div class="hero-container">
                <div class="hero-content">
                    <h1 class="hero-headline">Thinking together,<br>creating together</h1>
                    <p class="hero-subtitle">Joint prototype development. Taking digital technology to new heights.</p>
                    <a href="#contact" class="btn-hero-cta">Get in Touch</a>
                </div>
            </div>
        </div>

    </section>

</body>
</html>
